services:
  postgres:
    image: postgres:15-alpine
    container_name: satellite-postgres
    environment:
      POSTGRES_DB: satellite_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - space-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  telemetry-service:
    build:
      context: ./telemetry-service
      tags:
        - "telemetry-service:${VERSION:-latest}"
    image: telemetry-service:${VERSION:-latest}
    container_name: telemetry-service
    ports:
      - "9091:9091"
      - "8082:8082"
    networks:
      - space-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  space-operations-system:
    build:
      context: ./space-operations-system
      tags:
        - "space-operations-system:${VERSION:-latest}"
    image: space-operations-system:${VERSION:-latest}
    container_name: space-operations-system
    depends_on:
      postgres:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/satellite_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - GRPC_CLIENT_TELEMETRY_ADDRESS=static://telemetry-service:9091
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - space-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${SERVER_PORT:-8080}/actuator/health"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
      start_period: ${HEALTHCHECK_START_PERIOD:-30s}

  mission-scheduler:
    build:
      context: ./mission-scheduler
      tags:
        - "mission-scheduler:${VERSION:-latest}"
    image: mission-scheduler:${VERSION:-latest}
    container_name: mission-scheduler
    depends_on:
      space-operations-system:
        condition: service_healthy
    environment:
      - SERVER_PORT=${MISSION_PORT:-8081}
      - SERVER_URL=${SERVER_URL:-http://space-operations-system:8080}
    ports:
      - "${MISSION_PORT:-8081}:${MISSION_PORT:-8081}"
    networks:
      - space-net

volumes:
  postgres-data:

networks:
  space-net:
    driver: bridge