syntax = "proto3";

package telemetry;

option java_package = "org.example.telemetry";
option java_multiple_files = true;

service TelemetryService {
  rpc StreamTelemetry (TelemetryRequest) returns (stream TelemetryUpdate);
}

message TelemetryRequest {
  string constellation_name = 1;
  repeated string satellite_names = 2;
}

message TelemetryUpdate {
  string satellite_name = 1;
  string satellite_type = 2;
  double internal_temperature = 3;
  double external_temperature = 4;
  double battery_level = 5;
  bool is_active = 6;
  int64 timestamp = 7;
}